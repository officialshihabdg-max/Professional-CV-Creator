<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - ProCV Elite</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-box { max-width: 400px; margin: 100px auto; background: rgba(30, 41, 59, 0.9); padding: 40px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
    .login-box h2 { color: #fff; margin-bottom: 20px; }
    .login-box input { width: 100%; padding: 14px; margin: 10px 0; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; }
    .admin-dashboard { display: none; max-width: 1200px; margin: 30px auto; padding: 20px; }
    .request-card { background: rgba(30, 41, 59, 0.9); border-radius: 12px; padding: 20px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; border-left: 4px solid #f59e0b; }
    .request-card.approved { border-left-color: #10b981; }
    .req-info h4 { margin-bottom: 5px; color: #fff; }
    .req-info p { color: #94a3b8; font-size: 14px; }
    .req-actions button { padding: 8px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; margin-left: 5px; }
    .btn-approve { background: #10b981; color: #fff; }
    .btn-reject { background: #ef4444; color: #fff; }
    .btn-view { background: #4f46e5; color: #fff; }
  </style>
</head>
<body>

<div class="login-box" id="loginBox">
  <h2>🔒 Admin Access</h2>
  <input type="password" id="adminPass" placeholder="Enter admin password">
  <button class="btn-primary" onclick="adminLogin()" style="width:100%; justify-content:center;">Login</button>
</div>

<div class="admin-dashboard" id="adminDashboard">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;">
    <h1 style="color:#fff;">👑 Admin Dashboard</h1>
    <button class="btn-cancel" style="width:auto;padding:10px 20px; background:#334155; color:#fff;" onclick="location.reload()">Logout</button>
  </div>
  <div id="requestsList"></div>
</div>

<script src="js/admin.js"></script>
</body>
</html>
